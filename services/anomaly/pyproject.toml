[project]
name = "anomaly-detection-platform"
version = "0.1.0"
description = "Generic pattern and anomaly detection platform for CCTV analytics events, with a pluggable model"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5", "joblib>=1.4"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
lint = ["ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
